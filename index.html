<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 漫剧五环节国内模型评测 · 路由版</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#20242c; --sub:#616a78; --line:#dfe3ea;
    --blue:#2457e6; --green:#168a5a; --amber:#c46b0c; --red:#c93a3a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.65;font-size:15px;}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 18px 80px;}
  header{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 22px 16px;}
  h1{font-size:24px;margin:0 0 8px;line-height:1.35;}
  .meta{color:var(--sub);font-size:13px;}
  h2{font-size:19px;margin:34px 0 12px;padding-left:10px;border-left:4px solid var(--blue);}
  h3{font-size:16px;margin:12px 0 8px;}
  p{margin:8px 0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:15px 18px;margin:12px 0;}
  .notice{background:#eef4ff;border-color:#cbdaff;}
  .warn{background:#fff6e8;border-color:#f0d9ad;}
  .mini{font-size:12.5px;color:var(--sub);}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px;margin:12px 0;border:1px solid var(--line);}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
  th{background:#f0f2f6;}
  tr:last-child td{border-bottom:none;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stage-card{border:1px solid var(--line);border-radius:8px;margin:14px 0;overflow:hidden;background:var(--card);}
  .stage-head{padding:12px 16px;color:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .stage-head small{opacity:.85;font-weight:400;}
  .stage-body{padding:12px 16px 16px;}
  .model-card{border:1px solid var(--line);border-radius:8px;background:#fcfcfd;overflow:hidden;}
  .model-head{padding:9px 12px;background:#f0f2f6;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .model-head b{font-size:14px;}
  .asset{border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px 10px;margin:8px 0;}
  .dim{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed #edf0f4;font-size:13px;}
  .dim:first-child{border-top:none;}
  .dim .w{display:inline-block;min-width:44px;margin-left:7px;text-align:center;background:#edf2ff;color:var(--blue);border-radius:4px;font-size:11px;padding:1px 4px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;flex-wrap:nowrap;}
  .seg label{display:flex;align-items:center;padding:4px 8px;cursor:pointer;font-size:12px;border-left:1px solid var(--line);user-select:none;}
  .seg label:first-child{border-left:none;}
  .seg input{display:none;}
  .seg label.on-y{background:#e5f5ec;color:var(--green);}
  .seg label.on-p{background:#fff2dd;color:var(--amber);}
  .seg label.on-n{background:#fdeaea;color:var(--red);}
  .seg label.on-r{background:#e5f5ec;color:var(--green);}
  .seg label.on-s{background:#fff2dd;color:var(--amber);}
  .seg label.on-w{background:#fdeaea;color:var(--red);}
  .seg label.on-f{background:#f8d7d7;color:#8f1d1d;}
  .case-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed #edf0f4;font-size:12.5px;flex-wrap:wrap;}
  .case-row .label{flex:1;min-width:180px;}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer;}
  .btn.sec{background:#e9edf4;color:var(--ink);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
  .result{background:#eef4ff;border:1px solid #cbdaff;border-radius:8px;padding:16px 18px;margin:12px 0;}
  .scorebar{height:8px;border-radius:4px;background:#e6e8ec;overflow:hidden;margin:5px 0;}
  .scorebar i{display:block;height:100%;background:var(--blue);}
  .route-row{display:grid;grid-template-columns:22px 1fr 74px 62px;gap:8px;align-items:center;padding:7px 0;font-size:13px;}
  .empty{color:#9aa3b0;text-align:center;padding:16px;font-size:13px;}
  .toc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px;}
  .toc a{color:var(--blue);text-decoration:none;margin-right:14px;}
  .explain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0;}
  .explain-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px;}
  .explain-card h3{margin-top:2px;}
  .pipeline-note{background:linear-gradient(180deg,#fbfcff,#f4f7ff);border:1px solid #d7e1ff;border-radius:8px;padding:12px 16px;}
  .pipeline-note b{color:var(--blue);}
  .compare-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .compare{display:grid;grid-template-columns:minmax(170px,0.8fr) repeat(3,minmax(220px,1fr));min-width:830px;}
  .compare > div{padding:9px 11px;border-bottom:1px solid var(--line);background:#fff;}
  .compare > div:nth-child(4n){border-right:none;}
  .compare > div{border-right:1px solid var(--line);}
  .comp-label{color:#374151;font-size:13px;font-weight:600;background:#f7f8fa;}
  .comp-head{background:#eef1f6;font-weight:700;}
  .comp-model{background:#eef1f6;text-align:center;}
  .comp-model b{font-size:14px;display:block;}
  .comp-model small{color:var(--sub);font-weight:400;}
  .compare .comp-total{background:#f3f7ff;font-weight:800;font-size:16px;color:var(--blue);text-align:center;}
  .compare .comp-empty{color:#9aa3b0;font-size:12px;text-align:center;background:#fafbfc;}
  .media-note{font-size:12px;color:var(--sub);}
  .output-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;}
  .output-card{border:1px solid var(--line);border-radius:8px;background:#fcfcfd;padding:10px 12px;}
  .output-card h4{margin:2px 0 8px;font-size:13.5px;}
  .media-frame{position:relative;aspect-ratio:16/9;background:#0d1117;border:1px solid #d9dee6;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#9aa3b0;font-size:12px;text-align:center;line-height:1.5;}
  .media-frame img,.media-frame video{width:100%;height:100%;object-fit:contain;background:#0d1117;border:0;display:block;}
  .script-area{width:100%;min-height:150px;max-height:320px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:9px 11px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#20242c;resize:vertical;white-space:pre-wrap;word-break:break-word;}
  .file-btn{display:inline-block;margin-top:7px;padding:5px 10px;font-size:12px;color:var(--blue);border:1px solid #bfd0ff;background:#edf2ff;border-radius:5px;cursor:pointer;}
  .file-btn input[type=file]{display:none;}
  .task-prompt{background:#fbfcff;border:1px solid #d5dff5;border-radius:8px;padding:10px 12px;margin:8px 0 12px;}
  .task-prompt pre{white-space:pre-wrap;word-break:break-word;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.65;margin:6px 0 8px;color:#27334d;}
  .copy-mini{border:1px solid #bfd0ff;background:#eef3ff;color:var(--blue);border-radius:5px;padding:4px 9px;font-size:12px;cursor:pointer;}
  footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12px;}
  @media(max-width:860px){
    .grid3,.grid2,.explain-grid,.output-grid{grid-template-columns:1fr;}
  }
</style>
</head>

const STORAGE_KEY = "aigc-manju-five-stage-route-v1";
let state = importedState();
const app = document.getElementById("app");

function importedState(){
  const out={};
  const put=(name,val)=>{
    if(val!==undefined && val!==null && val!=="")out[name]=String(val);
  };
  CONFIG.stages.forEach(st=>{
    st.models.forEach(m=>{
      const rec=(IMPORTED[st.id]||{})[m.id]||{};
      st.dims.forEach(d=>put(radioName(st.id,m.id,d.id),rec[d.id]));
      if(st.special&&rec.special){
        CONFIG.specials.forEach(cs=>put(specialName(st.id,m.id,cs.id),rec.special[cs.id]));
      }
    });
  });
  return out;
}

function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function stageById(id){return CONFIG.stages.find(s=>s.id===id);}
function nameFor(stageId, modelId){return stageById(stageId).models.find(m=>m.id===modelId)?.name || modelId;}
function radioName(stage, model, key){return `score__${stage}__${model}__${key}`;}
function specialName(stage, model, caseId){return `special__${stage}__${model}__${caseId}`;}
function getVal(name){return state[name] ?? "";}
function setVal(name,val){state[name]=val;saveState();}

function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
}
function loadState(){
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)return JSON.parse(raw);}catch(e){}
  return {};
}
function clearState(){
  state={};
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  document.querySelectorAll("input[type=radio]").forEach(i=>i.checked=false);
  document.querySelectorAll(".seg label").forEach(l=>l.className="");
  const box=document.getElementById("result-box");
  if(box)box.innerHTML='<div class="empty">已清空，请重新勾选。</div>';
  updateScores();
}

function markSeg(input){
  const seg=input.closest(".seg");
  seg.querySelectorAll("label").forEach(l=>l.className="");
  const v=input.value;
  const isSpecial=input.name.startsWith("special__");
  const map={"1":"on-y","0.5":"on-p","0":isSpecial?"on-f":"on-n","0.8":"on-s","0.4":"on-w"};
  const label=input.closest("label");
  if(map[v])label.classList.add(map[v]);
  setVal(input.name,v);
}

function radioMarkup(name, options){
  const current=String(getVal(name));
  return `<div class="seg">${options.map(o=>{
    const checked=current===o.v?"checked":"";
    return `<label class="${checked?o.cls:""}"><input type="radio" name="${name}" value="${o.v}" ${checked}>${esc(o.text)}</label>`;
  }).join("")}</div>`;
}

function restore(){
  document.querySelectorAll("input[type=radio]").forEach(i=>{
    const saved=getVal(i.name);
    if(saved===i.value){
      i.checked=true;
      const label=i.closest("label");
      const isSpecial=i.name.startsWith("special__");
      label.classList.add(i.value==="1"?"on-y":i.value==="0.5"?"on-p":i.value==="0"?isSpecial?"on-f":"on-n":i.value==="0.8"?"on-s":i.value==="0.4"?"on-w":"");
    }
  });
}

function dimScore(stage, model){
  const st=stageById(stage);
  let sum=0,w=0;
  st.dims.forEach(d=>{
    const v=Number(getVal(radioName(stage,model,d.id)));
    if(v===0){sum+=0;w+=d.w;}
    else if(v){sum+=v*d.w;w+=d.w;}
  });
  return w?sum/w*100:null;
}

function specialScore(stage, model){
  if(!stageById(stage).special) return null;
  const vals=CONFIG.specials.map(c=>Number(getVal(specialName(stage,model,c.id)))).filter(v=>!Number.isNaN(v));
  if(!vals.length)return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length*100;
}

function stageScore(stage, model){
  const normal=dimScore(stage,model);
  if(stageById(stage).special){
    const special=specialScore(stage,model);
    if(normal===null&&special===null)return null;
    const n=normal??0,s=special??0;
    return Math.round((n*0.6+s*0.4)*10)/10;
  }
  return normal;
}

function updateScores(){
  CONFIG.stages.forEach(st=>{
    st.models.forEach(m=>{
      const el=document.getElementById(`score-${st.id}-${m.id}`);
      const s=stageScore(st.id,m.id);
      if(el)el.textContent=s===null?"未评分":`${s.toFixed(1)}`;
    });
  });
}

function outputSlot(st,m){
  const id=`out-${st.id}-${m.id}`;
  const fileId=`file-${st.id}-${m.id}`;
  if(st.kind==="text"){
    const label=st.no===1?"剧本预览":"分镜文本";
    return `<div class="output-card">
      <h4>${esc(m.name)} · ${label}</h4>
      <textarea class="script-area" id="${id}" placeholder="此处置放模型生成的${st.no===1?"剧本":"分镜"}文本。可以直接粘贴，也可以点击下方按钮选择 .txt / .md 文件查看。"></textarea>
      <label class="file-btn">选择文本文件<input type="file" id="${fileId}" accept=".txt,.md,.json,text/plain,application/json"></label>
    </div>`;
  }
  if(st.kind==="video"){
    return `<div class="output-card">
      <h4>${esc(m.name)} · 视频预览</h4>
      <div class="media-frame" id="${id}"><div>视频待添加<br>${esc(m.id)}.mp4</div></div>
      <label class="file-btn">选择视频查看<input type="file" id="${fileId}" accept="video/mp4,video/webm,video/quicktime"></label>
    </div>`;
  }
  return `<div class="output-card">
    <h4>${esc(m.name)} · ${st.no===3?"人物图":"分镜画面"}</h4>
    <div class="media-frame" id="${id}"><div>图片待添加<br>${esc(m.id)}.png</div></div>
    <label class="file-btn">选择图片查看<input type="file" id="${fileId}" accept="image/png,image/jpeg,image/webp"></label>
  </div>`;
}

    <h2 id="result">最终模型排名与推荐路线</h2>
    <div class="card">
      <div id="result-box"><div class="empty">完成五环节勾选后，点击“计算路由排名”。</div></div>
    </div>

    <h2 id="research">资料复核版模型评分报告</h2>
    <div class="card notice">
      <b>说明：</b>${esc(RESEARCH.method)} 本部分由公开资料核验生成，作为人工勾选结果的客观复核，不替代真实成片测试。
      若“Image 2 / Imagine 15”与你使用的产品名称不一致，应按实际接口重新校准。
    </div>
    <div class="card">
      <div style="font-size:17px;font-weight:700">资料复核推荐</div>
      <p style="margin:10px 0 0">${esc(RESEARCH.conclusion)}</p>
    </div>
    ${RESEARCH.groups.map(g=>`
      <div class="stage-card">
        <div class="stage-head" style="background:var(--blue)">
          <span><b>${esc(g.title)}</b></span>
          <small>${esc(g.subtitle)}</small>
        </div>
        <div class="stage-body">
          <div class="grid3">
            ${g.models.map(m=>`
              <div class="card" style="margin:0">
                <h3>No.${m.rank} · ${esc(m.name)}</h3>
                <p style="font-size:26px;font-weight:800;color:var(--blue);margin:4px 0 10px">${m.score.toFixed(1)}</p>
                ${m.criteria?`<p class="mini" style="background:#edf2ff;border-radius:6px;padding:6px 9px;margin:0 0 8px">${esc(m.criteria)}</p>`:""}
                <ul style="margin:6px 0;padding-left:18px">
                  ${m.facts.map(f=>`<li class="mini" style="margin:5px 0">${esc(f)}</li>`).join("")}
                </ul>
                <p class="mini" style="background:#fff6e8;border-radius:6px;padding:7px 9px;margin:8px 0 0">${esc(m.note)}</p>
              </div>`).join("")}
          </div>
        </div>
      </div>`).join("")}
    <div class="card">
      <h3>资料来源</h3>
      <ol style="margin:6px 0;padding-left:20px;font-size:13px">
        ${RESEARCH.sources.map(s=>`<li style="margin:5px 0"><a href="${esc(s.url)}" target="_blank" style="color:var(--blue)">${esc(s.label)}</a></li>`).join("")}
      </ol>
    </div>

    <footer>
      五环节 × 每环节 3 个国内模型 · 上一环节最优结果作为下一环节公共输入 ·
      人工勾选结果自动保存于当前浏览器 · 可复制 JSON 回传给 Codex 生成最终报告。
    </footer>`;
  restore();
  updateScores();
}

function stageResults(){
  return CONFIG.stages.map(st=>{
    const rows=st.models.map(m=>{
      const score=stageScore(st.id,m.id);
      return {model:m,score};
    }).sort((a,b)=>(b.score??-1)-(a.score??-1));
    return {stage:st,rows};
  });
}

function renderResult(){
  const results=stageResults();
  const rated=results.every(r=>r.rows.some(x=>x.score!==null));
  const box=document.getElementById("result-box");
  if(!rated){
    box.innerHTML='<div class="empty">还有环节没有评分：请至少给每个环节的一个模型完成评分。</div>';
    return;
  }
  const winners=results.map(r=>({stage:r.stage,row:r.rows[0],second:r.rows[1],third:r.rows[2]}));
  const routeScore=Math.round(winners.reduce((a,x)=>a+(x.row.score??0),0)/winners.length*10)/10;
  const rows=results.map((r,i)=>{
    const w=winners[i];
    return `<tr>
      <td><b>环节 ${r.stage.no} · ${esc(r.stage.name)}</b><br><span class="mini">公共输入：${esc(r.stage.input)}</span></td>
      <td>${r.rows.map(x=>`${esc(x.model.name)}：${x.score===null?"未评分":x.score.toFixed(1)}`).join("<br>")}</td>
      <td><b>${esc(w.row.model.name)}</b><br>${w.row.score?.toFixed(1)} 分</td>
    </tr>`;
  }).join("");
  box.innerHTML=`
    <div style="font-size:17px;font-weight:700">推荐全链路路线</div>
    <p>${winners.map(w=>`${w.stage.no}. ${esc(w.stage.name)} → <b>${esc(w.row.model.name)}</b>（${w.row.score?.toFixed(1)}）`).join("<br>")}</p>
    <p><b>路线总分：</b>${routeScore.toFixed(1)} / 100</p>
    <table>
      <tr><th>环节</th><th>本环节模型得分</th><th>环节最优模型</th></tr>
      ${rows}
    </table>
    <p class="mini">最终排名为“环节路由推荐”，适合每环节单独采购/路由模型。如果后续需要统一模型跑完整链路，再把五环节最优模型逐一替换为同一模型复测。</p>`;
}

function collectState(){
  const out={meta:{title:CONFIG.meta.title,prompt:{zh:CONFIG.prompt.zh,en:CONFIG.prompt.en}}};
  CONFIG.stages.forEach(st=>{
    out[st.id]={};
    st.models.forEach(m=>{
      const vals={};
      st.dims.forEach(d=>{
        const v=getVal(radioName(st.id,m.id,d.id));
        if(v!=="")vals[d.id]=Number(v);
      });
      if(st.special){
        vals.special={};
        CONFIG.specials.forEach(cs=>{
          const v=getVal(specialName(st.id,m.id,cs.id));
          if(v!=="")vals.special[cs.id]=Number(v);
        });
      }
      out[st.id][m.id]=vals;
    });
  });
  return out;
}

function copyState(){
  const payload=JSON.stringify(collectState(),null,2);
  const ta=document.createElement("textarea");
  ta.value=payload;
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand("copy");alert("已复制本轮勾选 JSON，可粘贴给 Codex。");}
  catch(e){alert("复制失败，请手动选择。");}
  document.body.removeChild(ta);
}

function copyPrompt(id){
  const el=document.getElementById(id);
  if(!el)return;
  const ta=document.createElement("textarea");
  ta.value=el.textContent||el.innerText||"";
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand("copy");alert("题目提示词已复制。");}
  catch(e){alert("复制失败，请手动选择。");}
  document.body.removeChild(ta);
}

document.addEventListener("change",async e=>{
  if(e.target.tagName==="INPUT"&&e.target.type==="file"&&e.target.id.startsWith("file-")){
    const file=e.target.files?.[0];
    if(!file)return;
    const key=e.target.id.slice("file-".length);
    const split=key.indexOf("-");
    const stage=key.slice(0,split);
    const model=key.slice(split+1);
    const out=document.getElementById(`out-${stage}-${model}`);
    const st=stageById(stage);
    if(!out||!st)return;
    const modelName=st.models.find(x=>x.id===model)?.name||model;
    if(st.kind==="text"){
      out.value=await file.text();
    }else{
      const url=URL.createObjectURL(file);
      out.innerHTML=st.kind==="video"
        ? `<video controls src="${url}"></video>`
        : `<img src="${url}" alt="${esc(modelName)} 预览">`;
    }
    return;
  }
  if(e.target.tagName==="INPUT"&&e.target.type==="radio"){
    markSeg(e.target);
    updateScores();
  }
});

render();
renderResult();
</script>
</body>
</html>
